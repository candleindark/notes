name: Update README tree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # On a PR, check out the PR's head branch (so the regenerated README
          # is committed back into the PR). On push, head_ref is empty and we
          # fall back to the pushed branch.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Regenerate README tree
        run: python3 scripts/generate_readme_tree.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README note tree [skip ci]"
          git push
